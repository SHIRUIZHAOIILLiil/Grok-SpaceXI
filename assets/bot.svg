<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Casefile bot">
  <defs>
    <radialGradient id="bg" cx="34%" cy="72%" r="80%">
      <stop offset="0%" stop-color="#1a2029"/>
      <stop offset="100%" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="face" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fdf7ec"/>
      <stop offset="100%" stop-color="#e9dece"/>
    </linearGradient>
    <clipPath id="card"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <g transform="translate(26,-18) scale(0.93)"><g transform="rotate(-12 210 360)">
      <!-- case-file tab, sitting on the crown -->
      <rect x="292" y="104" width="46" height="74" rx="10" fill="#c9a44c"/>
      <rect x="292" y="104" width="46" height="22" rx="10" fill="#e2c078"/>

      <!-- head -->
      <circle cx="210" cy="360" r="250" fill="url(#face)"/>

      <!-- two capsule eyes, no pupils, no brows -->
      <rect x="150" y="300" width="48" height="122" rx="24" fill="#0c1015"/>
      <rect x="256" y="300" width="48" height="122" rx="24" fill="#0c1015"/>

      <!-- blush -->
      <ellipse cx="112" cy="404" rx="38" ry="24" fill="#efa79d" opacity="0.6"/>
      <ellipse cx="344" cy="404" rx="38" ry="24" fill="#efa79d" opacity="0.6"/>
    </g></g>
  </g>
</svg>
